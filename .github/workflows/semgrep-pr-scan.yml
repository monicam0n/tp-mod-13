name: Semgrep + Reviewdog

on:
  pull_request:

jobs:
  semgrep-reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install semgrep
        run: pip install semgrep

      - name: Install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b $HOME/bin
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Run semgrep with reviewdog (GitHub PR reviewer)
        run: |
          semgrep --config=auto --json > semgrep.json
          cat semgrep.json | jq -r '.results[] | "\(.path):\(.start.line):\(.extra.message)"' | \
          reviewdog -efm="%f:%l:%m" \
            -name="semgrep" \
            -reporter=github-pr-review \
            -filter-mode=nofilter \
            -fail-on-error=false
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
