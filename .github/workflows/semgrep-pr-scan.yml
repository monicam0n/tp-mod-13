name: Semgrep PR Scan 

on:
  pull_request: {}

jobs:
  semgrep_diff_scan:
    name: semgrep/pr-diff
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Mark repo as safe for Git
        run: git config --global --add safe.directory $(pwd)

      - name: Run Semgrep
        run: semgrep --config auto --baseline-commit HEAD~ --sarif --output semgrep-results.sarif

      - name: Save SARIF results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-pr-results
          path: semgrep-results.sarif

      - name: Publish Semgrep SARIF Summary
        run: |
          if [[ -s semgrep-results.sarif ]]; then
          {
            echo "### 🧪 Semgrep Findings"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo '| Rule ID | Message | File | Line |'
            echo '|---------|---------|------|------|'
            jq -r '
              .runs[].results[] |
              "| \(.ruleId) | \(.message.text | gsub("\n"; " ")) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) |"
            ' semgrep-results.sarif
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          fi
