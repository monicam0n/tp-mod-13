name: Semgrep PR Scan 

on:
  pull_request: {}

jobs:
  semgrep_diff_scan:
    name: semgrep/pr-diff
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Mark repo as safe for Git
        run: git config --global --add safe.directory $(pwd)

      - name: Run Semgrep
        run: semgrep --config auto --baseline-commit HEAD~ --sarif --output semgrep-results.sarif

      - name: Save SARIF results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-pr-results
          path: semgrep-results.sarif

      - name: Publish Semgrep SARIF Summary
        run: |
          if [[ -s semgrep-results.sarif ]]; then
          {
            echo "### 🧪 Semgrep Findings"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo '| Rule ID | Message | File | Line | Level |'
            echo '|---------|---------|------|------|-------|'
            jq -r '
              def rule_level_map:
                (.runs[].tool.driver.rules // []) as $rules |
                reduce $rules[] as $r ({}; . + {($r.id): ($r.defaultConfiguration.level // "unknown")} );
      
              rule_level_map as $levels |
              .runs[].results[] |
              "| \(.ruleId // "") | \(.message.text | gsub("\n"; " ")) | \(.locations[0].physicalLocation.artifactLocation.uri // "") | \(.locations[0].physicalLocation.region.startLine // "") | \($levels[.ruleId] // "unknown") |"
            ' semgrep-results.sarif
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          fi

      - uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893
        with:
          reviewdog_version: latest
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cat semgrep-results.sarif | reviewdog -f=sarif -reporter=github-pr-check -fail-on-error=false

      - name: Fail if any critical/error/warning-level findings exist
        run: |
          critical_count=$(jq '
            def rule_level_map:
              (.runs[].tool.driver.rules // []) as $rules |
              reduce $rules[] as $r ({}; . + {($r.id): ($r.defaultConfiguration.level // "unknown")} );

            rule_level_map as $levels |
            [.runs[].results[] | select(($levels[.ruleId] // "unknown") == "critical")] | length
          ' semgrep-results.sarif)
          echo "Found $critical_count critical-level findings."
          
          error_count=$(jq '
            def rule_level_map:
              (.runs[].tool.driver.rules // []) as $rules |
              reduce $rules[] as $r ({}; . + {($r.id): ($r.defaultConfiguration.level // "unknown")} );

            rule_level_map as $levels |
            [.runs[].results[] | select(($levels[.ruleId] // "unknown") == "error")] | length
          ' semgrep-results.sarif)
          echo "Found $error_count error-level findings."
          
          warning_count=$(jq '
            def rule_level_map:
              (.runs[].tool.driver.rules // []) as $rules |
              reduce $rules[] as $r ({}; . + {($r.id): ($r.defaultConfiguration.level // "unknown")} );

            rule_level_map as $levels |
            [.runs[].results[] | select(($levels[.ruleId] // "unknown") == "warning")] | length
          ' semgrep-results.sarif)
          echo "Found $warning_count warning-level findings."
          
          if [ "$critical_count" -gt 0 ] || [ "$error_count" -gt 0 ] || [ "$warning_count" -gt 0 ] ; then
            echo "❌ Failing pipeline due to critical/error/warning-level findings"
            exit 1
          fi
          
