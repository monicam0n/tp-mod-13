name: Semgrep PR Scan 

on:
  pull_request: {}

jobs:
  semgrep_diff_scan:
    name: semgrep/pr-diff
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Semgrep on changed files
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          echo "Scanning diff against $BASE_REF"
          semgrep scan --config auto \
            --baseline-ref "$BASE_REF" \
            --sarif -q > semgrep-results.sarif

      - name: Save SARIF results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-pr-results
          path: semgrep-results.sarif

      - name: Upload SARIF to GitHub Security Dashboard
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep-results.sarif
        if: always()
