name: Semgrep PR Scan + Reviewdog

on:
  pull_request: {}
  workflow_call:  
    
jobs:
  semgrep_diff_scan:

    name: semgrep/pr-diff
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Mark repo as safe for Git
        run: git config --global --add safe.directory $(pwd)

      - name: Run Semgrep
        run: semgrep --config "p/default" --baseline-commit HEAD~ --sarif --output semgrep-results.sarif

      - name: Save SARIF results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-pr-results
          path: semgrep-results.sarif

      - name: Publish Semgrep SARIF Summary
        run: |
          if [[ -s semgrep-results.sarif ]]; then
          {
            echo "### 🧪 Semgrep Findings"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo '| Rule ID | Message | File | Line | Level |'
            echo '|---------|---------|------|------|-------|'
            jq -r '
              def rule_level_map:
                (.runs[].tool.driver.rules // []) as $rules |
                reduce $rules[] as $r ({}; . + {($r.id): ($r.defaultConfiguration.level // "unknown")} );
      
              rule_level_map as $levels |
              .runs[].results[] |
              "| \(.ruleId // "") | \(.message.text | gsub("\n"; " ")) | \(.locations[0].physicalLocation.artifactLocation.uri // "") | \(.locations[0].physicalLocation.region.startLine // "") | \($levels[.ruleId] // "unknown") |"
            ' semgrep-results.sarif
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          fi

      - uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893
        with:
          reviewdog_version: latest
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cat semgrep-results.sarif | reviewdog -f=sarif -reporter=github-pr-review -fail-on-error=false
