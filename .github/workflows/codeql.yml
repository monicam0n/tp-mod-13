# .github/workflows/codeql.yml
name: "CodeQL"

on:
  pull_request: {}

jobs:
  codeql-scan:
      name: Run CodeQL and show summary
      runs-on: ubuntu-latest
  
      permissions:
        security-events: write 
        actions: read
        contents: read
  
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: Initialize CodeQL
          uses: github/codeql-action/init@v3
          with:
            languages: javascript 
  
        - name: Autobuild
          uses: github/codeql-action/autobuild@v3
  
        - name: Run CodeQL analysis
          uses: github/codeql-action/analyze@v3
          with:
            output: codeql-results.sarif
            upload: false  # tidak upload ke dashboard GitHub
  
        - name: Generate SARIF summary
          run: |
            echo "## 🛡️ CodeQL Scan Results" >> $GITHUB_STEP_SUMMARY
            # Cek jika file SARIF ada dan tidak kosong
            if [ -s codeql-results.sarif ]; then
              count=$(jq '.runs[].results | length' codeql-results.sarif)
              if [ "$count" -eq 0 ]; then
                echo "✅ No issues found!" >> $GITHUB_STEP_SUMMARY
              else
                echo "Found $count issues:" >> $GITHUB_STEP_SUMMARY
                jq -r '
                  .runs[].results[] |
                  "- **\(.ruleId)**: \(.message.text)
                    (File: \(.locations[0].physicalLocation.artifactLocation.uri),
                     Line: \(.locations[0].physicalLocation.region.startLine))"
                ' codeql-results.sarif >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "⚠️ SARIF file not found or empty." >> $GITHUB_STEP_SUMMARY
            fi

        
